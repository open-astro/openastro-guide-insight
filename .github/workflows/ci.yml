name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgtk-3-dev libgsl-dev libpcre2-dev zlib1g-dev libpng-dev libjpeg-dev libtiff-dev libexpat1-dev
          # a decimal-comma locale for the locale-independence tests
          sudo locale-gen de_DE.UTF-8

      # Ubuntu packages an older wxWidgets 3.2, so build the pinned release.
      - name: Restore wxWidgets build
        id: wx-cache
        uses: actions/cache@v6
        with:
          path: ~/wx
          key: wx-${{ matrix.runner }}-${{ hashFiles('vcpkg-ports/wxwidgets/vcpkg.json', 'vcpkg-ports/wxwidgets/portfile.cmake', 'scripts/build-wxwidgets.sh') }}

      - name: Build wxWidgets
        if: steps.wx-cache.outputs.cache-hit != 'true'
        run: scripts/build-wxwidgets.sh ~/wx

      - name: Configure
        run: >
          cmake --preset linux
          -DCMAKE_PREFIX_PATH=$HOME/wx
          -DGUIDEINSIGHT_EXPECTED_WX_VERSION=$(cat ~/wx/wxwidgets-version.txt)
          -DGUIDEINSIGHT_WERROR=ON

      - name: Build
        run: cmake --build --preset linux -- -k 0

      - name: Test
        run: ctest --preset linux

      - name: Install
        run: DESTDIR=${{ github.workspace }}/stage cmake --install out/build/linux

      - name: Package artifact
        run: tar -C stage -czf openastro-guide-insight-linux-${{ matrix.arch }}.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: openastro-guide-insight-linux-${{ matrix.arch }}
          path: openastro-guide-insight-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgtk-3-dev libgsl-dev libpcre2-dev zlib1g-dev libpng-dev libjpeg-dev libtiff-dev libexpat1-dev
          # a decimal-comma locale for the locale-independence tests
          sudo locale-gen de_DE.UTF-8

      - name: Restore wxWidgets build
        id: wx-cache
        uses: actions/cache@v6
        with:
          path: ~/wx
          key: wx-ubuntu-24.04-${{ hashFiles('vcpkg-ports/wxwidgets/vcpkg.json', 'vcpkg-ports/wxwidgets/portfile.cmake', 'scripts/build-wxwidgets.sh') }}

      - name: Build wxWidgets
        if: steps.wx-cache.outputs.cache-hit != 'true'
        run: scripts/build-wxwidgets.sh ~/wx

      - name: Configure
        run: cmake --preset asan -DCMAKE_PREFIX_PATH=$HOME/wx

      - name: Build
        run: cmake --build --preset asan -- -k 0

      - name: Test
        run: ctest --preset asan

  vcpkg:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            preset: macos-arm64
            triplet: arm64-osx-26
            artifact: openastro-guide-insight-macos-arm64
            werror: "ON"
          - name: Windows x64
            runner: windows-latest
            preset: win-x64
            triplet: x64-windows-static
            artifact: openastro-guide-insight-windows-x64
            werror: "ON"
          - name: Windows ARM64
            runner: windows-11-arm
            preset: win-arm64
            triplet: arm64-windows-static
            artifact: openastro-guide-insight-windows-arm64
            werror: "ON"
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
      VCPKG_DISABLE_METRICS: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Check out vcpkg at exactly the manifest's builtin-baseline so the
      # dependency versions match vcpkg.json and a shallow clone is enough.
      - name: Fetch vcpkg at manifest baseline
        run: |
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          git init -q vcpkg
          git -C vcpkg fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$baseline"
          git -C vcpkg checkout -q FETCH_HEAD
          echo "VCPKG_BASELINE=$baseline" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Bootstrap vcpkg
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**', 'cmake/triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}-
            vcpkg-${{ matrix.triplet }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DGUIDEINSIGHT_WERROR=${{ matrix.werror }}

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-logs-${{ matrix.triplet }}
          path: |
            vcpkg/buildtrees/*/*.log
            out/build/${{ matrix.preset }}/vcpkg-manifest-install.log
          if-no-files-found: ignore

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Install
        run: cmake --install out/build/${{ matrix.preset }} --config Release --prefix stage

      - name: Package artifact
        run: |
          version=$(cat out/build/${{ matrix.preset }}/version.txt)
          if [[ "$RUNNER_OS" == macOS ]]; then
            # an ad-hoc signed disk image with an Applications link
            package=openastro-guide-insight-$version-macos-arm64.dmg
            scripts/make-dmg.sh "stage/OpenAstro Guide Insight.app" "$package"
            scripts/check-dmg.sh "$package"
          elif [[ "$RUNNER_OS" == Windows ]]; then
            # an Inno Setup 6 installer for this architecture
            arch=${{ matrix.preset == 'win-arm64' && 'arm64' || 'x64' }}
            iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            if [[ ! -x $iscc ]]; then
              choco install innosetup --no-progress -y >/dev/null
            fi
            "$iscc" //Q "//DArch=$arch" "//DSourceDir=$(cygpath -w "$PWD/stage")" \
              "//O$(cygpath -w "$PWD")" "$(cygpath -w out/build/${{ matrix.preset }}/openastro-guide-insight.iss)"
            package=openastro-guide-insight-$version-windows-$arch-setup.exe
            scripts/check-installer.sh "$package"
          else
            package=${{ matrix.artifact }}.tar.gz
            tar -C stage -czf "$package" .
          fi
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
